<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Dice</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
                 touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
                    display: block; background: #000; outline: none; }
    #loading { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
               color: #8a8a8a; font: 14px -apple-system, "Hiragino Sans", sans-serif; letter-spacing: 0.1em; }
    #bar { width: 40%; max-width: 240px; height: 2px; margin: 14px auto 0; background: #222; }
    #fill { width: 0; height: 100%; background: #d9b46a; transition: width 0.2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">読み込み中<div id="bar"><div id="fill"></div></div></div>
  <script>
    // 検証用（?diceStats のときだけ）：fps が落ちたとき、どこで時間を使っているかをブラウザ側から見る。
    //   画面更新 … ブラウザが描画の合図（requestAnimationFrame）を出している回数/秒。60 付近なら画面側は元気
    //   Unity描画 … そのうち Unity が実際に 1 コマ処理した回数/秒（fps の上限を守るため、残りは何もせず見送る）
    //   処理 … Unity が 1 コマに使った時間（平均/最大）。この中で GPU の完了待ちをしていれば、ここに出る
    //   Unity推定 … Unity が「この画面は何 Hz」と見積もっている値（Unity と同じ計算をここでも行う）
    // 検証用：WebGL の画面を不透明にする（Unity は alpha:true・premultipliedAlpha:false で作るため、
    // Safari が表示のたびに画面全体を変換している可能性がある）。
    //   ?diceOpaque … alpha:false（透明部分なし。背景は黒なので見た目は同じ）
    //   ?dicePremul … premultipliedAlpha:true だけ変える
    (function () {
      var opaque = location.search.indexOf("diceOpaque") >= 0, premul = location.search.indexOf("dicePremul") >= 0;
      if (!opaque && !premul) return;
      var gc = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attr) {
        if ((type === "webgl2" || type === "webgl") && attr) {
          if (opaque) attr.alpha = false;
          attr.premultipliedAlpha = true;
        }
        return gc.call(this, type, attr);
      };
    })();
    // 検証用：?diceNoAudio で音を実際には鳴らさない（Unity からは鳴らしたように見せる。音が原因かの切り分け）
    (function () {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (location.search.indexOf("diceNoAudio") < 0 || !AC) return;
      var orig = AC.prototype.createBufferSource;
      AC.prototype.createBufferSource = function () {
        var n = orig.apply(this, arguments), done = false;
        var finish = function () { if (!done) { done = true; n.dispatchEvent(new Event("ended")); } };
        n.start = function () { setTimeout(finish, 50); };
        n.stop = function () { setTimeout(finish, 0); };
        return n;
      };
    })();
    (function () {
      if (location.search.indexOf("diceStats") < 0) return;
      // 音の部品（1 回鳴らすごとに 1 個作られる）が、鳴り終わっても残っていないかを数える
      var made = 0, ended = 0;
      var AC = window.AudioContext || window.webkitAudioContext;
      var noAudio = location.search.indexOf("diceNoAudio") >= 0;
      if (AC && AC.prototype.createBufferSource) {
        var cbs = AC.prototype.createBufferSource;
        AC.prototype.createBufferSource = function () {
          var n = cbs.apply(this, arguments);
          made++;
          n.addEventListener("ended", function () { ended++; });
          return n;
        };
      }
      // ?diceGL：Unity が出している描画命令（WebGL の呼び出し）を数え、どの命令で時間を使っているかを測る
      var glOn = location.search.indexOf("diceGL") >= 0, glCount = {}, glTime = {};
      if (glOn) {
        [window.WebGL2RenderingContext, window.WebGLRenderingContext].forEach(function (C) {
          if (!C) return;
          var proto = C.prototype;
          Object.getOwnPropertyNames(proto).forEach(function (k) {
            var d = Object.getOwnPropertyDescriptor(proto, k);
            if (!d || typeof d.value !== "function" || k === "constructor") return;
            var f = d.value;
            proto[k] = function () {
              var s = performance.now();
              var r = f.apply(this, arguments);
              glTime[k] = (glTime[k] || 0) + performance.now() - s;
              glCount[k] = (glCount[k] || 0) + 1;
              return r;
            };
          });
        });
      }
      var raf = window.requestAnimationFrame.bind(window);
      var calls = 0, frames = 0, busy = 0, busyMax = 0, gapMax = 0, lastFrame = 0, est = 60;
      window.requestAnimationFrame = function (fn) {
        if (!fn || fn.name !== "Browser_mainLoop_runner") return raf(fn);
        return raf(function (t) {
          var s = performance.now();
          fn(t);
          var d = performance.now() - s;
          calls++;
          if (d > 0.3) { // 見送ったときは一瞬で戻る
            frames++; busy += d; busyMax = Math.max(busyMax, d);
            if (lastFrame) gapMax = Math.max(gapMax, s - lastFrame);
            lastFrame = s;
          }
        });
      };
      // Unity 6 のフレームワークと同じ方法で画面の Hz を見積もる
      var dts = Array(60).fill(1000 / 60), sums = Array(60).fill(1000), idx = 0, prev = performance.now();
      raf(function loop(now) {
        var dt = now - prev; prev = now;
        var p = (idx + 59) % 60;
        sums[idx] = sums[p] - dts[idx] + dt; dts[idx] = dt;
        if (Math.max.apply(null, dts) < Math.min.apply(null, dts) + 3 && Math.max.apply(null, sums) < Math.min.apply(null, sums) + 8) {
          var fr = 1000 / (sums[idx] / 60) | 0, cmp = [75, 144, 165, Math.round((fr + 5) / 10) * 10];
          for (var i = 0; i < cmp.length; i++) if (Math.abs(fr - cmp[i]) < 2) fr = cmp[i];
          est = fr;
        }
        idx = (idx + 1) % 60;
        raf(loop);
      });
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;left:8px;top:96px;z-index:10;pointer-events:none;color:#ff0;font:12px/1.35 monospace;white-space:pre;text-shadow:0 0 2px #000";
      document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
      // 1 コマあたりの値にして表示：描画回数・画面の切り替え回数・命令の総数と時間、時間を使っている命令の上位
      function glSummary(n) {
        n = Math.max(1, n);
        var draws = 0, total = 0, totalT = 0, keys = Object.keys(glCount);
        keys.forEach(function (k) {
          total += glCount[k]; totalT += glTime[k];
          if (k.indexOf("draw") === 0) draws += glCount[k];
        });
        keys.sort(function (a, b) { return glTime[b] - glTime[a]; });
        var top = keys.slice(0, 4).map(function (k) {
          return "  " + k + " " + (glTime[k] / n).toFixed(1) + "ms x" + (glCount[k] / n).toFixed(0);
        }).join("\n");
        return "\nGL 1コマ: 描画 " + (draws / n).toFixed(0) + "  切替 " + ((glCount.bindFramebuffer || 0) / n).toFixed(0) +
          "  命令 " + (total / n).toFixed(0) + "  計 " + (totalT / n).toFixed(1) + " ms\n" + top;
      }
      // Unity が作った WebGL を覚えておく（こちらから getContext を呼ぶと、Unity より先に既定の設定で作ってしまうため）
      var unityGL = null, gc2 = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attr) {
        var r = gc2.call(this, type, attr);
        if (r && (type === "webgl2" || type === "webgl") && this.id === "unity-canvas") unityGL = r;
        return r;
      };
      function ctxInfo() {
        var c = document.querySelector("#unity-canvas"), gl = unityGL;
        var a = gl && gl.getContextAttributes ? gl.getContextAttributes() : null;
        return a ? "alpha " + (a.alpha ? "あり" : "なし") + " premul " + (a.premultipliedAlpha ? "あり" : "なし") + " " + c.width + "x" + c.height : "?";
      }
      var t0 = performance.now();
      setInterval(function () {
        var sec = (performance.now() - t0) / 1000; t0 = performance.now();
        box.textContent =
          "画面更新 " + (calls / sec).toFixed(0) + "/s  Unity描画 " + (frames / sec).toFixed(0) + "/s\n" +
          "処理 平均 " + (frames ? busy / frames : 0).toFixed(1) + " ms  最大 " + busyMax.toFixed(0) + " ms  間隔最大 " + gapMax.toFixed(0) + " ms\n" +
          "Unity推定 " + est + " Hz\n画面 " + ctxInfo() + "\n" +
          "音" + (noAudio ? "（鳴らさない設定）" : "") + " 鳴らした " + made + "  鳴り終わり " + ended +
          (glOn ? glSummary(frames) : "");
        calls = frames = busy = busyMax = gapMax = 0;
        glCount = {}; glTime = {};
      }, 1000);
    })();

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Dice",
      productVersion: "0.1.0",
      // 描画解像度は画面の 2 倍まで（iPhone の 3 倍だと描く量が 2.25 倍になり重い）。?diceHigh で端末の解像度そのまま
      // 検証用：?diceDpr=1.5 などで描画解像度の倍率を指定（GPU の負担と fps の関係を見る）
      devicePixelRatio: (function () {
        var m = location.search.match(/diceDpr=([0-9.]+)/);
        if (m && parseFloat(m[1]) > 0) return parseFloat(m[1]);
        var dpr = window.devicePixelRatio || 1;
        if (location.search.indexOf("diceHigh") >= 0) return dpr;
        // スマホ・タブレットは画面と同じ倍率（1 倍）で描く。iPhone は GPU を全力で動かせるのが十数秒だけで、
        // 2 倍で描くと全力の間でも 1 コマ約 35ms、速さが落ちると約 70ms（12fps）になる。1 倍なら落ちても 30fps を保てる
        var mobile = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        return mobile ? 1 : Math.min(dpr, 2);
      })(),
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill");
    var loading = document.querySelector("#loading");
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.remove();
      }).catch(function (message) {
        loading.textContent = "読み込みに失敗しました：" + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
